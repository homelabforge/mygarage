name: MyGarage
version: "3.0.0"
slug: mygarage
description: Self-hosted vehicle maintenance tracking (VIN, fuel, service, LiveLink).
url: https://github.com/homelabforge/mygarage
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8686
panel_icon: mdi:garage
panel_title: MyGarage
map:
  - data:rw
ports:
  8686/tcp: 8686
ports_description:
  8686/tcp: MyGarage web UI and REST API (widget API + webhooks)
options:
  log_level: info
  auth_mode: none
  timezone: UTC
  scheduler_enabled: true
schema:
  log_level: list(trace|debug|info|warning|error|fatal)
  auth_mode: list(none|local|oidc)
  timezone: str
  scheduler_enabled: bool
