[pytest]
# Pytest configuration for MyGarage backend tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add the backend root to sys.path so tests can use absolute imports
# like ``from tests.migrations.fixtures.fuel_type_locales import all_pairs``
# regardless of how pytest is invoked. CLAUDE.md notes the project uses
# ``PYTHONPATH=.`` for local runs; this ini-side setting makes the same
# rootpath available to CI (which doesn't set PYTHONPATH explicitly).
pythonpath = .

# Asyncio mode for async tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# Tests must share the fixture loop, otherwise asyncpg connections that
# live on the session-scoped engine get awaited from per-test loops and
# fail with "Future attached to a different loop" / "another operation
# in progress". See https://github.com/homelabforge/mygarage/issues/77.
asyncio_default_test_loop_scope = session

# Markers
markers =
    unit: Unit tests that don't require database
    integration: Integration tests that use the database
    analytics: Analytics-specific tests
    auth: Authentication/authorization tests
    vehicle: Vehicle management tests
    service: Service record tests
    fuel: Fuel record tests
    family: Family multi-user system tests
    slow: Tests that take significant time to run
    migrations: Migration behavior and crash recovery tests
    livelink: LiveLink/WiCAN telemetry and firmware tests
    def_records: DEF (diesel exhaust fluid) record tests
    notifications: Notification backend tests
    supplies: Parts & supplies (light inventory) tests
    own_vehicle: Column overrides for the tests conftest's own_vehicle fixture

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Every warning fails the test it came from, so a deprecation gets fixed the
# day it shows up, not the day the library drops the old way. Later lines win.
# One raised while the app imports stops the whole session at conftest load
# (exit 4), not one test.
#
# The allowlist:
# - slowapi 0.1.10 is its newest release and still calls
#   asyncio.iscoroutinefunction, which Python 3.16 removes. Drop this when it
#   ships a fix, or before we move to 3.16.
# - pymupdf aliases typing.ByteString at import, gone in Python 3.17.
# - ResourceWarning and the unraisable/thread warnings fire from the garbage
#   collector on whatever test happens to be running, so a fatal one would be
#   a flake. Shown, not fatal.
# - A SQLAlchemy deprecation is a removal on the next minor, so it stays an
#   error even if a broader line above it ever gets relaxed.
filterwarnings =
    error
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi
    ignore:'typing.ByteString' and 'collections.abc.ByteString' are deprecated:DeprecationWarning:pymupdf
    default::ResourceWarning
    default::pytest.PytestUnraisableExceptionWarning
    default::pytest.PytestUnhandledThreadExceptionWarning
    error::sqlalchemy.exc.SADeprecationWarning

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore
norecursedirs = .git .tox dist build *.egg venv
