[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mygarage"
version = "3.10.0"
description = "Self-hosted vehicle maintenance tracking application"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.140.13",
    "granian>=2.7.9",
    "sqlalchemy[asyncio]>=2.1.2",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",  # PostgreSQL async driver
    "psycopg2-binary>=2.9.12",  # PostgreSQL sync driver for migrations
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0.post0,<3",  # pandas breaks on 3.0 tz (pandas#71459); lift once that lands
    "apscheduler>=3.11.3",
    "tzlocal>=5.3.1",  # direct: household timezone fallback (was transitive via apscheduler)
    "pillow>=12.3.0",
    "pillow-heif>=1.5.0",
    "reportlab>=5.0.0",
    "pandas>=3.0.5",
    "numpy>=2.3.3",  # direct: used in analytics trends, PDF charts and both OCR paths;
                     # was only ever a pandas/matplotlib transitive, so its major was not ours to choose
    "email-validator>=2.3.0",
    "python-magic>=0.4.27",
    "slowapi>=0.1.10",
    "argon2-cffi>=25.1.0",
    "joserfc>=1.7.4",  # JWT encoding/decoding and JWKS verification (replaces authlib.jose)
    "cryptography>=50.0.2",  # direct: AES-256-GCM for secret settings at rest (was only a joserfc transitive)
    "pymupdf>=1.28.0,<2",  # 2.0 drags in onnxruntime + pymupdf4llm; we only read pages
    "pytesseract>=0.3.13",
    "aiosmtplib>=5.1.2",  # Async SMTP for email notifications
    "aiomqtt>=2.5.1",  # Async MQTT client for LiveLink WiCAN support
    "matplotlib>=3.11.1",  # Chart generation for PDF analytics reports
    "rich>=15.0.0",  # Pretty container log output when MYGARAGE_LOG_PRETTY=true
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",  # Test-only: tests/unit/test_pg_ci_path.py reads the CI workflow.
    "pyjwt>=2.13.0",  # Test-only: used by tests/integration/routes/test_auth.py to decode JWT exp/iat claims without verification. Production auth uses joserfc.
    "httpx2>=2.16.0",  # Test-only: starlette.testclient wants it, and with plain httpx it warns on import (the lifespan tests use TestClient).
    "pyright>=1.1.411",
    "ruff>=0.16.0",
    "pandas-stubs>=3.0.5.260730",
    "types-Pillow>=10.2.0.20240822",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]
"app/models/*.py" = ["E402"]
"app/routes/analytics.py" = ["E402"]
"app/services/window_sticker_parsers/*.py" = ["E402"]
"app/services/poi/osm.py" = ["N806"]  # Haversine formula uses math notation (R, Δφ, Δλ)
"tests/*" = ["S101"]

[tool.pyright]
# Pyright strict type checking for the MyGarage backend.
# Version: 1.1.414
# Reference: https://microsoft.github.io/pyright/#/configuration
#
# Suppressions: `# pyright: ignore[rule]  # reason` on the offending line only.
# `# type: ignore` is inert (enableTypeIgnoreComments = false), an ignore that
# suppresses nothing is an error, and file-level pragmas may only relax the
# style rules (reportPrivateUsage, reportUnusedFunction, reportUnusedClass).
# tests/unit/test_pyright_config.py enforces all of that and catches a
# misspelled key here, which pyright itself would only print and skip.

# Project Structure
# app/, tools/, scripts/ and migrations/ get the root (strict) settings;
# tests/ gets the executionEnvironments entry at the bottom.
include = ["app", "tests", "tools", "scripts", "migrations", "unlink_oidc_wrapper.py"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.venv",
    "**/venv",
]
pythonVersion = "3.15"
pythonPlatform = "Linux"

typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

# === Third-party library gaps ===
reportUntypedFunctionDecorator = "none"  # FastAPI @app.get(), SlowAPI @limiter.limit()
reportUnknownLambdaType = "none"  # Lambda types inferred from context
reportMissingTypeArgument = "none"  # Complex generic structures (SQLAlchemy/FastAPI)

# === Errors ===
# These three used to be off, blamed on Depends() and ORM descriptors. The real
# causes were pyright skipping a descriptor's __get__ in protocol matching (ORM
# models now pass as `Model | Shape` aliases) and positional Field(None, ...)
# defaults it can't see (now Field(default=...)).
reportArgumentType = "error"
reportAttributeAccessIssue = "error"
reportCallIssue = "error"
reportMissingImports = "error"  # the optional paddleocr imports carry scoped ignores
reportGeneralTypeIssues = "error"
reportReturnType = "error"
reportOptionalMemberAccess = "error"
reportOptionalOperand = "error"
reportOptionalSubscript = "error"
reportPossiblyUnboundVariable = "error"
reportIndexIssue = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportConstantRedefinition = "error"
reportDeprecated = "error"
reportInvalidTypeForm = "error"
reportDuplicateImport = "error"
reportWildcardImportFromLibrary = "error"
reportInconsistentConstructor = "error"
reportOverlappingOverload = "error"
reportInvalidStringEscapeSequence = "error"

# === Warnings ===
reportMissingModuleSource = "warning"
reportUnnecessaryComparison = "warning"  # Defensive checks, kept on purpose
reportMissingParameterType = "warning"
reportUnusedImport = "warning"  # Ruff handles via F401
reportUnusedVariable = "warning"  # Ruff handles via F841
reportUnusedFunction = "warning"  # Helper functions, utilities
reportUnusedClass = "warning"  # Base classes, mix-ins
reportPrivateUsage = "warning"
reportUninitializedInstanceVariable = "warning"
reportMissingTypeStubs = "warning"  # Many Python libraries lack stubs
reportUnknownArgumentType = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUntypedClassDecorator = "warning"
reportUntypedBaseClass = "warning"

# Tests: "standard-plus". executionEnvironments ignores typeCheckingMode but
# honours per-rule overrides, so strict-only rules are set to their standard
# value by hand. Everything else inherits the root.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportMissingImports = "error"  # without this a broken import would pass silently
strictListInference = false
strictDictionaryInference = false
strictSetInference = false
# strict-only rules at their standard value
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportPrivateUsage = "none"
reportUnusedImport = "none"  # ruff F401 covers tests
reportUnusedVariable = "none"  # ruff F841 covers tests
reportUnusedFunction = "none"
reportUnusedClass = "none"
reportMissingTypeStubs = "none"
reportUntypedBaseClass = "none"
reportUntypedClassDecorator = "none"
reportUntypedFunctionDecorator = "none"
reportUntypedNamedTuple = "none"
reportConstantRedefinition = "none"
reportDeprecated = "none"
reportTypeCommentUsage = "none"
reportInconsistentConstructor = "none"
reportMatchNotExhaustive = "none"
reportUnnecessaryCast = "none"
reportInvalidTypeVarUse = "warning"
reportUnsupportedDunderAll = "warning"
# kept from strict on purpose: these catch a test that can't fail (a bare
# `x == y` with no assert, `assert (x, "msg")`) and dead branches in helpers
reportUnnecessaryComparison = "error"
# TEMPORARY until the test rows are fixed: today's values
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportGeneralTypeIssues = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
reportOptionalSubscript = "warning"
reportPossiblyUnboundVariable = "warning"
reportReturnType = "warning"
reportIndexIssue = "warning"
reportIncompatibleMethodOverride = "warning"
reportIncompatibleVariableOverride = "warning"
reportUnnecessaryTypeIgnoreComment = "none"
