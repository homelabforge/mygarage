log_fuel:
  name: Log fuel
  description: Create a fuel (or charge) record via the MyGarage inbound webhook.
  fields:
    vin:
      required: true
      example: "1HGCM82633A004352"
      selector:
        text:
    date:
      required: true
      example: "2026-08-08"
      selector:
        date:
    odometer_km:
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    liters:
      selector:
        number:
          min: 0
          step: 0.001
          mode: box
    kwh:
      selector:
        number:
          min: 0
          step: 0.001
          mode: box
    cost:
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    notes:
      selector:
        text:

set_odometer:
  name: Set odometer
  description: Record an odometer reading via the MyGarage inbound webhook.
  fields:
    vin:
      required: true
      selector:
        text:
    odometer_km:
      required: true
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
    date:
      selector:
        date:
    notes:
      selector:
        text:

complete_reminder:
  name: Complete reminder
  description: Mark a vehicle reminder completed via the inbound webhook.
  fields:
    vin:
      required: true
      selector:
        text:
    reminder_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
