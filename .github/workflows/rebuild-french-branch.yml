name: Rebuild French locale branch

on:
  push:
    branches:
      - feature/french-locale-clean
    paths:
      - .github/workflows/rebuild-french-branch.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean branch
        uses: actions/checkout@v4
        with:
          ref: feature/french-locale-clean
          fetch-depth: 0

      - name: Import and synchronize French locale
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin copilot/traduction-francais
          git checkout origin/copilot/traduction-francais -- frontend/public/locales/fr

          python <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          source_locales = root / 'frontend/src/locales/en'
          translated_locales = root / 'frontend/public/locales/fr'

          def load(path: Path):
              with path.open(encoding='utf-8') as f:
                  return json.load(f)

          def save(path: Path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open('w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write('\n')

          def merge_source(source, translated):
              if isinstance(source, dict):
                  current = translated if isinstance(translated, dict) else {}
                  return {key: merge_source(value, current.get(key)) for key, value in source.items()}
              if isinstance(source, list):
                  return translated if isinstance(translated, list) else source
              return translated if isinstance(translated, type(source)) else source

          namespaces = ['common', 'nav', 'settings', 'vehicles', 'forms', 'analytics']
          for namespace in namespaces:
              en_path = source_locales / f'{namespace}.json'
              fr_path = translated_locales / f'{namespace}.json'
              merged = merge_source(load(en_path), load(fr_path) if fr_path.exists() else {})
              save(fr_path, merged)

          common_path = translated_locales / 'common.json'
          common = load(common_path)
          if 'login' in common:
              common['login']['usernameOrEmail'] = 'Nom d’utilisateur ou adresse e-mail'
          if 'shopFinder' in common:
              common['shopFinder']['subtitle'] = 'Découvrez des ateliers de réparation automobile et pour camping-cars à proximité'
              common['shopFinder']['rvRepair'] = 'Réparation de camping-cars'
              common['shopFinder']['locationPromptRv'] = 'Nous avons besoin de votre position pour trouver des ateliers de réparation pour camping-cars à proximité dans un rayon de {{radius}} {{unit}}.'
              common['shopFinder']['searchingHintRv'] = 'Recherche d’ateliers de réparation pour camping-cars à proximité dans un rayon de {{radius}} {{unit}}'
          if 'addressBook' in common and 'categoryRvPark' in common['addressBook']:
              common['addressBook']['categoryRvPark'] = 'Aire de camping-cars'
          if 'poiFinder' in common:
              common['poiFinder']['subtitle'] = 'Découvrez des ateliers automobiles, des bornes de recharge pour véhicules électriques, des stations-service et des services pour camping-cars à proximité'
              common['poiFinder']['categoryEvCharging'] = 'Recharge de véhicules électriques'
              common['poiFinder']['categoryRvShops'] = 'Ateliers pour camping-cars'
          if 'addressBookPage' in common:
              common['addressBookPage']['businessNamePlaceholder'] = 'Garage Dupont'
              common['addressBookPage']['contactNamePlaceholder'] = 'Jean Dupont'
              common['addressBookPage']['streetAddressPlaceholder'] = '12 rue de la République'
              common['addressBookPage']['cityPlaceholder'] = 'Nantes'
          if 'poiCard' in common:
              common['poiCard']['categoryRvShop'] = 'Atelier pour camping-cars'
              common['poiCard']['categoryEvCharging'] = 'Recharge de véhicules électriques'
          save(common_path, common)

          forms_path = translated_locales / 'forms.json'
          forms = load(forms_path)
          if 'fuel' in forms and 'mpgTip' in forms['fuel']:
              forms['fuel']['mpgTip'] = 'Le MPG est calculé uniquement pour les pleins complets. Cochez « Plein complet » pour activer le calcul du MPG.'
          if 'service' in forms and 'insuranceClaim' in forms['service']:
              forms['service']['insuranceClaim'] = 'N° de dossier d’assurance'
          save(forms_path, forms)

          analytics_path = translated_locales / 'analytics.json'
          analytics = load(analytics_path)
          try:
              analytics['vehicleHelp']['tips']['markFullTank'] = 'Marquez les pleins comme « pleins complets » pour un suivi précis de la consommation'
          except KeyError:
              pass
          save(analytics_path, analytics)

          nav_path = translated_locales / 'nav.json'
          nav = load(nav_path)
          if 'analytics' in nav:
              nav['analytics'] = 'Analyses'
          save(nav_path, nav)

          backend = root / 'backend/app/constants/i18n.py'
          text = backend.read_text(encoding='utf-8')
          if '"fr"' not in text:
              text = re.sub(r'(SUPPORTED_LANGUAGES[^=]*=\s*\{\s*"en"\s*,)', r'\1 "fr",', text, count=1)
          backend.write_text(text, encoding='utf-8')

          constants = root / 'frontend/src/constants/i18n.ts'
          text = constants.read_text(encoding='utf-8')
          if "code: 'fr'" not in text:
              text = text.replace(
                  "  { code: 'en', name: 'English', nativeName: 'English' },",
                  "  { code: 'en', name: 'English', nativeName: 'English' },\n  { code: 'fr', name: 'French', nativeName: 'Français' },",
                  1,
              )
          if "fr: 'fr-FR'" not in text:
              text = text.replace("    en: 'en-US',", "    en: 'en-US',\n    fr: 'fr-FR',", 1)
          constants.write_text(text, encoding='utf-8')

          i18n = root / 'frontend/src/i18n.ts'
          text = i18n.read_text(encoding='utf-8')
          match = re.search(r"supportedLngs:\s*\[([^\]]*)\]", text)
          if match and "'fr'" not in match.group(1):
              replacement = match.group(0).replace("['en'", "['en', 'fr'", 1)
              text = text[:match.start()] + replacement + text[match.end():]
          i18n.write_text(text, encoding='utf-8')

          translating = root / 'TRANSLATING.md'
          if translating.exists():
              text = translating.read_text(encoding='utf-8')
              if '| fr | French |' not in text and '| en | English' in text:
                  text = text.replace('| en | English (canonical source) |', '| en | English (canonical source) |\n| fr | French |', 1)
              translating.write_text(text, encoding='utf-8')

          for namespace in namespaces:
              load(translated_locales / f'{namespace}.json')

          print('French locale synchronized with latest upstream source keys.')
          PY

      - name: Commit clean French locale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebuild-french-branch.yml
          git add backend/app/constants/i18n.py frontend/src/constants/i18n.ts frontend/src/i18n.ts frontend/public/locales/fr TRANSLATING.md
          git commit -m "feat: add French locale support"
          git push origin HEAD:feature/french-locale-clean
