name: Translations

# Two deliberately separate concerns:
#   * validate — the real, contributor-actionable correctness gate (missing
#     keys, broken {{interpolation}}, and keys used in code but absent from
#     English). This is the check that should fail a translation PR, and the
#     one contributors are told to run locally (`bun run validate:translations`).
#     Note the two halves check opposite directions: validate-translations.ts
#     checks each language AGAINST English, while validate-i18n-usage.ts checks
#     CODE against English — a key missing from English itself is invisible to
#     the former and renders raw to users (that gap shipped once already).
#     The code half also runs in the main CI's Frontend Tests job, which is not
#     path-filtered, so a `t()` added without touching locales is still caught.
#   * status — advisory only. Regenerates TRANSLATIONS.md + the shields.io
#     badge and reports any drift in the job summary, but NEVER fails. Those
#     files are generated artifacts a maintainer refreshes (usually after
#     merge) via `bun run generate:translation-status`; an external
#     contributor is not expected to regenerate them, so drift must not block
#     their PR. Output is deterministic (no date stamp) so it only drifts on
#     real translation changes.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/locales/**'
      - 'frontend/public/locales/**'
      - 'frontend/scripts/**'
      - '.github/workflows/translations.yml'
  pull_request:
    paths:
      - 'frontend/src/locales/**'
      - 'frontend/public/locales/**'
      - 'frontend/scripts/**'
      - '.github/workflows/translations.yml'

concurrency:
  group: translations-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Translations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'

      # The four i18n scripts import only Node built-ins, and this step used to
      # skip `bun install` for that reason. `validate-units.ts` broke the
      # assumption: it loads the real TypeScript compiler out of node_modules to
      # resolve what an identifier refers to, which no regex can do. Without the
      # install it fails with ENOENT rather than silently reporting a clean tree,
      # because the gate asserts its parser before scanning, but red is red.
      #
      # Installing here also keeps this job honest as a standalone reproduction
      # of what a contributor runs locally: `bun run validate:translations` needs
      # dependencies now, and a workflow that pretends otherwise teaches the
      # wrong thing.
      - name: Install dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Validate translations
        run: cd frontend && bun run validate:translations

  status:
    name: Translation Status (advisory)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'

      - name: Regenerate translation status
        run: cd frontend && bun run generate:translation-status

      - name: Report drift (advisory — never fails)
        run: |
          if git diff --quiet TRANSLATIONS.md .github/badges/translations.json; then
            echo "✓ Translation status files are up to date" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### 📋 Translation status is out of date"
              echo ""
              echo "\`TRANSLATIONS.md\` / the badge don't match the locale files."
              echo "**This does not block the PR** — a maintainer regenerates them"
              echo "(usually after merge):"
              echo ""
              echo '```'
              echo "cd frontend && bun run generate:translation-status"
              echo '```'
              echo ""
              echo "<details><summary>Drift</summary>"
              echo ""
              echo '```diff'
              git diff TRANSLATIONS.md .github/badges/translations.json
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Translation status out of date::TRANSLATIONS.md/badge will be regenerated by a maintainer. This does not block the PR."
          fi
