name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: homelabforge/shared-workflows/.github/workflows/python-react-ci.yml@v1.6.0
    with:
      enable-translations: true
      enable-pg-migrations: true
      # Closes #77: run both migration and integration tests against the PG
      # sidecar so the asyncpg loop-binding regression that gated this work
      # can't reappear. Pytest accepts multiple positional paths.
      # The pg_*_test.py suites don't match python_files, so they're named
      # outright. pg_migration_path_test.py drops the public schema, so it runs
      # right after tests/migrations/, ahead of anything that builds tables.
      # Everything else runs on PG too: SQLite ignores VARCHAR widths, so a
      # SQLite-only test can be green and wrong (#200). Every dir and top-level
      # file is listed by name, because pytest folds an overlapping `tests/` into
      # one walk that runs integration first and drops pg_migration_path_test.py.
      # tests/unit/test_pg_ci_path.py fails CI if a new test file isn't listed.
      pg-migrations-pytest-path: >-
        tests/migrations/
        tests/pg_migration_path_test.py
        tests/pg_comprehensive_test.py
        tests/pg_issue_regression_test.py
        tests/pg_smoke_test.py
        tests/integration/
        tests/routes/
        tests/services/
        tests/tasks/
        tests/unit/
        tests/utils/
        tests/test_address_book_update_poi.py
        tests/test_address_book_vendor_sync.py
        tests/test_analytics_routes.py
        tests/test_analytics_service.py
        tests/test_config_root_path.py
        tests/test_currency.py
        tests/test_fuel_enums.py
        tests/test_html_base.py
        tests/test_oidc_issuer_trailing_slash.py
        tests/test_oidc_prefix_urls.py
        tests/test_units.py
      security-tripwire-script: .github/scripts/security-tripwire.sh
