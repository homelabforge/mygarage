name: Unit Gate Selftest

# The unit gate's mutation harness: every deliberate defect in
# units_gate_selftest.py's MUTATIONS and WALK_MUTATIONS tables, applied to a copy
# of scripts/validate-units.ts or of eslint.config.js, each of which must flip
# exactly the corpus cases that name it, plus the tree-walk and baseline proofs.
#
# The count is deliberately not written here: the run prints it, and a number in
# prose is a number that goes stale. An earlier version of this comment said 40
# when the tables held 44.
#
# The manifest's own harness lives in units-manifest-gate.yml. The two were one
# workflow until 2026-08-30. They had to be split because `paths:` is applied per
# WORKFLOW and not per job, so units.manifest.json in the shared filter fired
# this 47-minute job as well as the 0.4-second one. Every locale file carries a
# manifest row, so every translation PR re-stamped a digest and paid the full
# mutation run for a file this harness does not read: PR #155 (German) is the
# worked example. Nothing here reads units.manifest.json, and the one mention of
# that name in units_gate_selftest.py is inside a prose string.
#
# Why it is a workflow of its own rather than a step in the main CI job:
#
#   * it re-runs a whole corpus leg per mutation, so its cost is
#     cases x mutations and it moves whenever either grows. MEASURED at 1278 s
#     on a phase 4 run, and at 1266.0 s and 1266.7 s on two runs before it, all
#     three at 85 cases, 80 scan mutations and 3 walk mutations; and at 1229.8
#     to 1232.9 s on three runs at 84 cases and
#     79 scan mutations, up from a measured 1071.6 s at 79 and 74
#     scan mutations, 10 min 34 s at 66 and 60, and 3 min 38 s at 49 and 41.
#     Plan 3b task 8 and its fix round added the cases and the mutations that
#     moved it. Every figure here is from a timed run on the same host,
#     because the one before them was INFERRED from spaced polling, said ~18
#     minutes, and was wrong by 5x in the direction that would have justified
#     weakening the check. Re-measure after any change to either table rather
#     than reasoning about the delta;
#   * ★ EVERY LOCAL FIGURE ABOVE IS LOCAL, AND THE TIMEOUT GOVERNS THE RUNNER,
#     which is the gap that let this job stop finishing without anyone noticing.
#     `bf6a078` COMPLETED in 397 s at 49 cases, 41 scan mutations and 3 walk
#     mutations, which is 1.8x the 218 s local figure at those same counts.
#     `4a63349`, at 85 cases and 80 scan mutations, was CANCELLED at 45m16s by
#     the old 45-minute budget. `f5a4106` then COMPLETED in 47m02s (2822 s) at
#     those same counts under the 90-minute budget, a 2.20x ratio against its
#     own 1284 s local run;
#   * the set of files that can change its result is small and knowable, so the
#     `paths:` filter below is exact rather than a guess: the gate, the corpus,
#     this harness, eslint.config.js, units.baseline.json (read at
#     units_gate_selftest.py:1823 for the R4 count-versus-membership proof),
#     translation-utils.ts (validate-units.ts imports ROOT from it),
#     package.json plus bun.lock, because a TypeScript or ESLint major genuinely
#     can change what the mutations do, and the FOUR SOURCES the three phase-3b
#     detectors derive their vocabularies from at runtime. Those four were
#     missing when the detectors landed, and a filter that claims to be exact
#     while missing an input is worse than one that admits it is a guess.
#     validate-reachability.ts is deliberately NOT here: its three mentions in
#     this harness and its corpus are prose, and the only real import of it
#     (walkGraph) is in validate-units-manifest.ts, so it moved to the manifest
#     workflow with the job that actually depends on it;
#   * SAMPLING IT IS NOT AN OPTION. Which mutant survives is not knowable in
#     advance, which is the entire premise of a mutation harness, so a sampled
#     run is how a survivor hides. The cost has gone from those ten minutes to
#     21 locally and past 45 in CI, which is an argument for a bigger budget
#     and for the process-spawn lever below, not for a cheaper run that can
#     miss a survivor.
#
# ★ IT DID NEED TO BE FASTER, AND THE LEVER WAS PROCESS SPAWNS, not coverage.
# The script leg now runs several mutations at once, each in its own mutant
# path and fixture dir. MEASURED on the same host, same tree: 1299.57 s serial
# against 415.70 s at 8 workers, a 3.13x cut, with output BYTE-IDENTICAL across
# all 80 mutation verdicts and every proof. Nothing is sampled and no mutant is
# dropped. The ESLint leg stays serial on purpose: eslint.config.js pins the
# rule to the literal path scripts/__units_corpus__.tsx, so a per-worker
# fixture name would fall outside the rule's scope and report zero findings on
# every case, which reads as a mutation that flipped nothing rather than as an
# error. It is 9 mutations and 2.6% of the spawns, so that trade is not close.
#
# ★ THE FIGURES ABOVE ARE LOCAL, AND THE RUNNER IS WHAT THE TIMEOUT GOVERNS.
# Workers are capped at min(8, nproc), and a GitHub runner has 4, so expect
# less than the 3.13x seen at 8. The 90-minute budget stays until a completed
# runner log says otherwise. Re-measure THERE, then cut it.
#
# The remaining lever, if it is ever needed, is still spawns and still not
# coverage: about 6,800 `bun` and `bunx` invocations each pay full interpreter
# startup for a scan that takes milliseconds, so batching several cases per
# invocation, or scanning in-process, would take most of what is left off the
# clock. That one needs a multi-file mode in validate-units.ts, which is the
# artifact under test, so it carries a proof obligation this change does not.
#
# The historical note, kept because it is the reason to distrust an estimate: The run is about 6,800 `bun` and `bunx` invocations (85 cases x 80
# mutations, plus the reference pass, the validity probes and the scope, walk,
# baseline, cross-file, clean-room and re-export proofs), each paying full
# interpreter startup for a scan that
# takes milliseconds. Batching several cases per invocation, or scanning
# in-process, would take most of it off the clock without dropping a single
# mutant. Cutting mutants to buy time is the one optimisation that trades away
# the thing the job exists for.
#
# ★ WHY THERE IS A FINGERPRINT JOB AS WELL AS A `paths:` FILTER. The filter is
# necessary and not sufficient. On `pull_request` GitHub matches `paths:`
# against the CUMULATIVE PR diff (base...head), never the push that triggered
# the run, and `frontend/src/types/api.generated.ts` is in the list AND is
# regenerated by any backend schema change. So the first commit that touches it
# arms the filter for the life of the PR, and every later push pays the full
# run, CHANGELOG-only commits included.
#
# MEASURED on the v3.3.0 PR (#158): six runs, 50 + 47 + 23 + 32 + 47 + 51
# minutes, about 250 minutes of runner time. THREE of the six pushes touched no
# file this harness reads at all: 4fae869 (settings cards), 1dad557 (livelink
# readability), e464e67a (hostname). That is the whole of the "we edited a
# document and waited an hour" complaint.
#
# The fix is a content fingerprint rather than a cleverer diff. hashFiles over
# the exact input set is a key, and a cache entry under that key is a RECEIPT
# that this harness already passed on those exact bytes. It is agnostic to the
# shape of the triggering event, it is right across a revert (the same bytes
# hash to the same key), and because a receipt written on main is readable from
# PRs based on main, a PR that changes nothing here skips on its FIRST push
# rather than its second.
#
# What the fingerprint CANNOT see is toolchain drift: the ubuntu-latest image,
# and whatever bun resolves that bun.lock does not pin. The weekly `schedule:`
# trigger ignores the receipt for exactly that reason, so the longest this can
# go unproven is a week.
#
# ★ Deliberately NOT a required check. A required check with a `paths:` filter
# never reports on the PRs it filters out, which leaves those PRs wedged waiting
# for a status that will never arrive. Keep this out of branch protection and
# that hazard does not apply. The corpus it mutates DOES run on every PR, inside
# `validate:translations` in the required Frontend Tests job, so the loosening
# direction is guarded continuously and only the harness proving the corpus is
# occasional.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/scripts/validate-units.ts'
      - 'frontend/scripts/units_gate_corpus.py'
      - 'frontend/scripts/units_gate_selftest.py'
      - 'frontend/scripts/units.baseline.json'
      # The three detectors DERIVE their vocabularies from these four at
      # runtime, so a change to any of them changes what the mutations do.
      - 'frontend/src/utils/units.ts'
      - 'frontend/src/utils/decimalSafe.ts'
      - 'frontend/src/types/units.ts'
      - 'frontend/src/types/api.generated.ts'
      - 'frontend/eslint.config.js'
      - 'frontend/scripts/translation-utils.ts'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      # setup-bun resolves the interpreter from this, and the whole run is
      # bun subprocesses. It was missing from the "exact" list above.
      - '.bun-version'
      - '.github/workflows/units-gate.yml'
  pull_request:
    paths:
      - 'frontend/scripts/validate-units.ts'
      - 'frontend/scripts/units_gate_corpus.py'
      - 'frontend/scripts/units_gate_selftest.py'
      - 'frontend/scripts/units.baseline.json'
      # The three detectors DERIVE their vocabularies from these four at
      # runtime, so a change to any of them changes what the mutations do.
      - 'frontend/src/utils/units.ts'
      - 'frontend/src/utils/decimalSafe.ts'
      - 'frontend/src/types/units.ts'
      - 'frontend/src/types/api.generated.ts'
      - 'frontend/eslint.config.js'
      - 'frontend/scripts/translation-utils.ts'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      # setup-bun resolves the interpreter from this, and the whole run is
      # bun subprocesses. It was missing from the "exact" list above.
      - '.bun-version'
      - '.github/workflows/units-gate.yml'
  # Ignores the receipt below, which is what bounds the drift a content
  # fingerprint cannot see: the ubuntu-latest image, and anything bun resolves
  # that bun.lock does not pin.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: units-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fingerprint:
    # Cheap (about 15 s) and it exists because `paths:` above cannot do the
    # job alone. See the header: on `pull_request` GitHub matches `paths:`
    # against the CUMULATIVE PR diff, so one commit touching api.generated.ts
    # makes every later push in that PR pay the full run.
    #
    # The key is a hash of the exact input set, and a cache entry under it is
    # a RECEIPT that this harness already passed on those bytes. Hit, skip.
    # Miss, run. Content, not provenance: a revert hashes back to a key that
    # already has a receipt and correctly skips, which no diff of a push range
    # gets right.
    name: Inputs already proven?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      key: ${{ steps.key.outputs.key }}
      run: ${{ steps.decide.outputs.run }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fingerprint the harness inputs
        id: key
        # Keep this list identical to BOTH `paths:` filters above. A file in
        # the filter but not here re-runs the harness for nothing; a file here
        # but not in the filter can never trigger the run that would refresh
        # its receipt. The `-v1-` is a manual bust: bump it to invalidate every
        # receipt at once.
        env:
          HASH: ${{ hashFiles(
            'frontend/scripts/validate-units.ts',
            'frontend/scripts/units_gate_corpus.py',
            'frontend/scripts/units_gate_selftest.py',
            'frontend/scripts/units.baseline.json',
            'frontend/src/utils/units.ts',
            'frontend/src/utils/decimalSafe.ts',
            'frontend/src/types/units.ts',
            'frontend/src/types/api.generated.ts',
            'frontend/eslint.config.js',
            'frontend/scripts/translation-utils.ts',
            'frontend/package.json',
            'frontend/bun.lock',
            '.bun-version',
            '.github/workflows/units-gate.yml'
            ) }}
        run: |
          set -euo pipefail
          if [ -z "$HASH" ]; then
            # hashFiles returns empty when nothing matched, which means the
            # list above has gone stale against the tree. Emit no key: the
            # decide step reads that as "run".
            echo "::warning::fingerprint matched no files; running the harness unconditionally"
            echo "key=" >> "$GITHUB_OUTPUT"
          else
            echo "key=units-gate-selftest-v1-$HASH" >> "$GITHUB_OUTPUT"
          fi

      - name: Prove the fingerprint covers every triggering path
        # ★ GUARD THE GUARD. The dangerous drift is one-directional: a file in
        # `paths:` but NOT in the hash above fires this workflow, leaves the
        # fingerprint unchanged, hits the receipt, and SKIPS, so a real change
        # to a real input reads as already proven. The reverse (hashed but not
        # in paths) only costs a run that never happens, which is what the
        # filter already meant. So assert paths is a SUBSET of the hash list,
        # and that the two paths blocks agree with each other.
        run: |
          python3 - <<'CHECK'
          import re, sys, pathlib
          s = pathlib.Path(".github/workflows/units-gate.yml").read_text()
          blocks = re.findall(r"^    paths:\n((?:(?:      [-#].*)?\n)+)", s, re.M)
          filters = [set(re.findall(r"^      - '([^']+)'", b, re.M)) for b in blocks]
          call = re.search(r"HASH: \$\{\{ hashFiles\(\n(.*?)\n *\) \}\}", s, re.S)
          hashed = set(re.findall(r"'([^']+)'", call.group(1))) if call else set()
          bad = False
          if not call:
              print("::error::could not find the hashFiles() call to read the fingerprint list from")
          if len(filters) != 2 or not hashed:
              print(f"::error::parsed {len(filters)} paths blocks and {len(hashed)} hashed entries; expected 2 and non-empty")
              bad = True
          for i, f in enumerate(filters):
              missing = sorted(f - hashed)
              if missing:
                  print(f"::error::paths block {i} lists files the fingerprint does not hash: {missing}")
                  bad = True
          if len(filters) == 2 and filters[0] != filters[1]:
              print(f"::error::the push and pull_request paths blocks differ: {sorted(filters[0] ^ filters[1])}")
              bad = True
          if bad:
              sys.exit(1)
          print(f"fingerprint covers all {len(filters[0])} triggering paths")
          CHECK

      - name: Look for a passing receipt
        id: receipt
        # schedule and workflow_dispatch deliberately skip the lookup so they
        # always re-prove. continue-on-error keeps a cache-service outage from
        # deciding anything: a failed lookup leaves cache-hit empty, and empty
        # means run.
        if: >-
          steps.key.outputs.key != ''
          && github.event_name != 'workflow_dispatch'
          && github.event_name != 'schedule'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .units-gate-receipt
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Decide
        id: decide
        # ★ FAIL OPEN AT EVERY BRANCH. The only path to run=false is an
        # explicit cache-hit on a non-forced event. Anything else (no key, no
        # hit, a lookup that errored, an event this does not name) runs the
        # harness. A skip logic that can fail closed is a way to silently
        # switch the gate off, which is the one outcome worse than it being
        # slow.
        env:
          KEY: ${{ steps.key.outputs.key }}
          HIT: ${{ steps.receipt.outputs.cache-hit }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ]; then
            run=true; why="forced by $EVENT"
          elif [ -z "$KEY" ]; then
            run=true; why="no usable fingerprint"
          elif [ "$HIT" = "true" ]; then
            run=false; why="receipt $KEY already exists, inputs are byte-identical to a passing run"
          else
            run=true; why="no receipt for $KEY"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "$why"
          echo "**Unit gate selftest: $( [ "$run" = true ] && echo RUNNING || echo SKIPPED )** ($why)" >> "$GITHUB_STEP_SUMMARY"

  selftest:
    name: Unit Gate Selftest (advisory)
    needs: [fingerprint]
    if: needs.fingerprint.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 90 rather than 45. MEASURED ON THE RUNNER at last, which is the number
    # this budget actually governs and the one every earlier figure in this file
    # was not: run 33317510064 on f5a4106 completed in 47m02s (2822 s) at 85
    # cases, 80 scan mutations and 3 walk mutations. Against the 1284 s local
    # run of the same commit that is a CI-to-local ratio of 2.20x, so the old
    # 45-minute budget missed by two minutes and this one leaves 91% headroom.
    # Re-measure HERE, not just locally, whenever either table grows: the
    # earlier completed run (bf6a078, 397 s at 49 cases and 41 mutations) gave a
    # 1.8x ratio, and the ratio moved with the corpus. Advisory and not in
    # branch protection (checked: the seven required contexts are the ci and
    # codeql ones), so a long job blocks no PR.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'

      # The gate loads the real TypeScript compiler out of node_modules to
      # resolve what an identifier refers to, and the ESLint leg needs the
      # plugin closure, so the install is not optional here.
      - name: Install dependencies
        run: cd frontend && bun install --frozen-lockfile

      # Never piped: a pipe would mask the exit code, which is the only thing
      # this job reports.
      - name: Run the unit gate selftest
        run: cd frontend && bun run validate:units-selftest

      # Only reached when the step above exited 0, so the receipt means
      # "passed", never "ran". Written last for the same reason.
      - name: Write the receipt
        if: success() && needs.fingerprint.outputs.key != ''
        run: echo "$GITHUB_SHA passed at $(date -u +%FT%TZ)" > .units-gate-receipt

      - name: Record the receipt
        if: success() && needs.fingerprint.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .units-gate-receipt
          key: ${{ needs.fingerprint.outputs.key }}
