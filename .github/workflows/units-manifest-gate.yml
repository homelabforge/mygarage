name: Unit Manifest Selftest

# `units.manifest.json`'s mutation harness, plus the merge-base drift check.
#
# The manifest is a reviewed snapshot over a stated universe, and the rule that
# put it in CI is the same one that put the gate selftest there: an artifact
# asserting something about every module has to be shown FAILING, in each
# direction it claims to cover.
#
# Split out of units-gate.yml on 2026-08-30. `paths:` is applied per WORKFLOW
# and not per job, so while these two shared a file, units.manifest.json in the
# filter fired the 47-minute gate selftest as well as this one. Every locale
# file carries a manifest row, so every translation PR re-stamped a digest and
# paid the full mutation run for a file that harness does not read. Splitting
# costs nothing: neither job is a required check, both keep their existing job
# names, and this one runs in its own tempdir tree so it never contended with
# the other for the shared fixture lock anyway.
#
# MEASURED at 0.4 s: it mutates a manifest and a five-file tree rather than
# re-running a corpus, so it is here for tidiness and isolation, not for cost.
# The 15-minute budget is almost entirely checkout and install.
#
# The paths below are what can actually change its result: the manifest, its
# checker, this harness, units.baseline.json (the checker cross-checks the two
# artifacts against each other, which is the [baseline.*] class of finding),
# validate-reachability.ts (validate-units-manifest.ts imports walkGraph from it
# to derive the universe), translation-utils.ts (it imports ROOT from it), and
# the dependency files.
#
# Deliberately NOT a required check, for the same reason as the gate selftest: a
# required check with a `paths:` filter never reports on the PRs it filters out,
# leaving them wedged on a status that will never arrive. The checker itself DOES
# run on every PR, inside `validate:translations` in the required Frontend Tests
# job; only the harness proving the checker is occasional.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/scripts/units.manifest.json'
      - 'frontend/scripts/validate-units-manifest.ts'
      - 'frontend/scripts/units_manifest_selftest.py'
      - 'frontend/scripts/units.baseline.json'
      - 'frontend/scripts/validate-reachability.ts'
      - 'frontend/scripts/translation-utils.ts'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      - '.github/workflows/units-manifest-gate.yml'
  pull_request:
    paths:
      - 'frontend/scripts/units.manifest.json'
      - 'frontend/scripts/validate-units-manifest.ts'
      - 'frontend/scripts/units_manifest_selftest.py'
      - 'frontend/scripts/units.baseline.json'
      - 'frontend/scripts/validate-reachability.ts'
      - 'frontend/scripts/translation-utils.ts'
      - 'frontend/package.json'
      - 'frontend/bun.lock'
      - '.github/workflows/units-manifest-gate.yml'
  workflow_dispatch:

concurrency:
  # Its own group. Sharing units-gate's would make a manifest run cancel an
  # in-flight gate selftest, which is the one job here that cannot be cheaply
  # re-run.
  group: units-manifest-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifest-selftest:
    name: Unit Manifest Selftest (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # fetch-depth: 0 because the conclusion-drift check below reads the
      # PREVIOUS manifest out of git. At the default depth of 1 there is no
      # base commit to compare against and the check would report that it did
      # not run, every time, forever.
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'

      # The checker needs no node_modules of its own, but `bun install` keeps
      # this job's environment identical to the gate selftest's rather than
      # subtly different in a way nobody would notice until it mattered.
      - name: Install dependencies
        run: cd frontend && bun install --frozen-lockfile

      # Runs in its own tempdir tree, so unlike the gate corpus and gate
      # selftest it takes no shared fixture lock and can run beside them.
      # Never piped: a pipe would mask the exit code.
      - name: Run the unit manifest selftest
        run: cd frontend && bun run validate:units-manifest-selftest

      # ★ The drift check against the MERGE BASE, which is the case the local
      # default cannot cover. `bin/ci-check` runs the checker with its default
      # `--against-ref HEAD`, so an uncommitted erasure fails on the author's
      # machine; but once committed, HEAD carries the erasure and the working
      # tree agrees with it. Only a comparison against the base sees a finding
      # that was deleted somewhere in the branch.
      #
      # Never piped, and it exits 0 with a loud "NOT checked" line rather than
      # silently passing when there is no base to compare against.
      - name: Check that no conclusion weakened against the merge base
        run: |
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit for this event, so there is nothing to compare against"
            exit 0
          fi
          cd frontend && bun run scripts/validate-units-manifest.ts --against-ref "$base"
