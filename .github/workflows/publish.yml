name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    uses: homelabforge/shared-workflows/.github/workflows/python-react-publish.yml@v1.7.0-rc2
    with:
      enable-translations: true
      security-tripwire-script: .github/scripts/security-tripwire.sh
      # Same splits as ci.yml; publish has no PG job.
      backend-test-shards: 2
      frontend-test-shards: 3
      e2e-test-shards: 2
      image-name: homelabforge/mygarage
      release-name-prefix: 'MyGarage v'
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
