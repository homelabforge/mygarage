# End-to-end test stack — exercised by `tests/release-smoke/run.sh`.
# Brings up Postgres + two mygarage instances (one PG-backed, one SQLite-backed)
# from a freshly built image, then runs smoke.py against each.
#
# Project name is set to mygarage-release-smoke via run.sh so this can't collide with
# the user's main homelab stack.
#
# Image tag is parameterized: run.sh builds and tests `mygarage:release-smoke`
# by default. Ad-hoc invocations can override with `MYGARAGE_E2E_IMAGE=...` to
# test a pre-built image (e.g. a GHCR pull during a soak), but the default
# MUST match the tag `run.sh` builds — otherwise the gate silently exercises
# a stale image and lets bad releases through.

services:
  pg:
    image: postgres:17-alpine
    container_name: mygarage-release-smoke-pg
    environment:
      POSTGRES_DB: mygarage
      POSTGRES_USER: mygarage
      POSTGRES_PASSWORD: e2epass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygarage -d mygarage"]
      interval: 2s
      timeout: 5s
      retries: 30

  app-pg:
    image: ${MYGARAGE_E2E_IMAGE:-mygarage:release-smoke}
    container_name: mygarage-release-smoke-app-pg
    depends_on:
      pg:
        condition: service_healthy
    environment:
      MYGARAGE_DATABASE_URL: postgresql+asyncpg://mygarage:e2epass@pg:5432/mygarage
      MYGARAGE_SECRET_KEY: e2e-secret-not-for-production
      MYGARAGE_AUTH_MODE: local
      MYGARAGE_TEST_MODE: "true"
    volumes:
      - app-pg-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app-sqlite:
    image: ${MYGARAGE_E2E_IMAGE:-mygarage:release-smoke}
    container_name: mygarage-release-smoke-app-sqlite
    environment:
      MYGARAGE_SECRET_KEY: e2e-secret-not-for-production
      MYGARAGE_AUTH_MODE: local
      MYGARAGE_TEST_MODE: "true"
    volumes:
      - app-sqlite-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Smoke runner — invoked via `docker compose run --rm smoke <target-url>`.
  # Lives in the same compose network so it reaches the apps by service name.
  smoke:
    image: python:3.15-slim
    container_name: mygarage-release-smoke-smoke
    depends_on:
      app-pg:
        condition: service_healthy
      app-sqlite:
        condition: service_healthy
    volumes:
      - ./smoke.py:/smoke.py:ro
    entrypoint: ["sh", "-c", "pip install -q httpx && python /smoke.py \"$$@\"", "--"]

volumes:
  app-pg-data:
  app-sqlite-data:
